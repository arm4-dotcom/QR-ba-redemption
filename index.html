<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR BA Redemption</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-line;
    }

    .success {
      background: #e8f5e9 !important;
    }

    .error {
      background: #ffebee !important;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      background: #eeeeee;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
    }

    .userid {
      margin-top: 15px;
      padding: 12px;
      background: #eeeeee;
      border-radius: 8px;
      font-size: 13px;
      word-break: break-all;
      text-align: left;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>QR BA Redemption</h1>

    <div id="status">
      กำลังเริ่ม LIFF...
    </div>


    <div
      id="qrinfo"
      class="info"
      style="display:none;"
    ></div>


    <div
      id="userid"
      class="userid"
      style="display:none;"
    ></div>

  </div>


<script>

// ============================================================
// CONFIG
// ============================================================

// LIFF ID
const LIFF_ID =
  '2011608815-zoBVWfw9';


// Google Apps Script Web App
const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwkRRQ_KHO3cp7AX4V7N7c7v0Sdoir4oPbacRkm0kQo0WgVNAp18A1bQrxp-5Mly0csEA/exec';


// ============================================================
// ELEMENTS
// ============================================================

const statusBox =
  document.getElementById('status');

const userIdBox =
  document.getElementById('userid');

const qrInfoBox =
  document.getElementById('qrinfo');


// ============================================================
// GET QR_ID FROM URL
// ============================================================

function getQRId() {

  // ----------------------------------------------------------
  // 1. อ่าน qr จาก URL ปกติ
  // ----------------------------------------------------------

  const params =
    new URLSearchParams(
      window.location.search
    );

  const directQR =
    params.get('qr');

  if (directQR) {

    return directQR.trim();

  }


  // ----------------------------------------------------------
  // 2. กรณี LINE LIFF เก็บ parameter ไว้ใน liff.state
  // ----------------------------------------------------------

  const liffState =
    params.get('liff.state');

  if (liffState) {

    try {

      const decodedState =
        decodeURIComponent(liffState);

      const stateParams =
        new URLSearchParams(
          decodedState
        );

      const stateQR =
        stateParams.get('qr');

      if (stateQR) {

        return stateQR.trim();

      }

    } catch (error) {

      console.error(
        'Cannot parse liff.state:',
        error
      );

    }

  }


  // ----------------------------------------------------------
  // 3. ไม่พบ QR
  // ----------------------------------------------------------

  return null;

}


// ============================================================
// DISPLAY QR INFORMATION
// ============================================================

function showQRInfo(qrId) {

  qrInfoBox.style.display =
    'block';

  qrInfoBox.innerHTML =

    '<strong>QR ID:</strong><br>' +
    qrId;

}


// ============================================================
// START LIFF
// ============================================================

async function startLIFF() {

  try {

    // --------------------------------------------------------
    // 1. Initialize LIFF ก่อน
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังเชื่อมต่อ LINE...';

    await liff.init({

      liffId:
        LIFF_ID

    });


    // --------------------------------------------------------
    // 2. อ่าน QR_ID หลัง LIFF init
    // --------------------------------------------------------

    const qrId =
      getQRId();


    // --------------------------------------------------------
    // ตรวจสอบ QR_ID
    // --------------------------------------------------------

    if (!qrId) {

      statusBox.innerText =
        'ไม่พบ QR_ID\n\nกรุณาเปิดผ่าน QR Code ที่ถูกต้อง';

      statusBox.className =
        'error';

      return;

    }


    // แสดง QR ที่ตรวจพบ
    showQRInfo(qrId);


    // --------------------------------------------------------
    // 3. ตรวจสอบ Login
    // --------------------------------------------------------

    if (!liff.isLoggedIn()) {

      statusBox.innerText =
        'กำลังเข้าสู่ระบบ LINE...';

      liff.login({

        redirectUri:
          window.location.href

      });

      return;

    }


    // --------------------------------------------------------
    // 4. ขอ ID Token
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังตรวจสอบตัวตน...';

    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่สามารถรับ LINE ID Token ได้'
      );

    }


    // --------------------------------------------------------
    // 5. ส่ง ID Token + QR_ID ไปยัง GAS
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังส่งข้อมูลไปยัง Server...';


    const response =
      await fetch(

        GAS_URL,

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              idToken:
                idToken,

              qrId:
                qrId

            }),

          redirect:
            'follow'

        }

      );


    // --------------------------------------------------------
    // 6. อ่านผลจาก GAS
    // --------------------------------------------------------

    const result =
      await response.json();


    console.log(
      'Server response:',
      result
    );


    // --------------------------------------------------------
    // 7. ตรวจสอบผล
    // --------------------------------------------------------

    if (!result.success) {

      throw new Error(

        result.message ||
        'Server verification failed'

      );

    }


    // --------------------------------------------------------
    // 8. แสดงผลสำเร็จ
    // --------------------------------------------------------

    statusBox.innerText =
      'ตรวจสอบ LINE User และ QR สำเร็จ';

    statusBox.className =
      'success';


    // --------------------------------------------------------
    // แสดง LINE User ID
    // --------------------------------------------------------

    userIdBox.style.display =
      'block';

    userIdBox.innerHTML =

      '<strong>LINE User ID</strong><br>' +

      result.lineUserId;


    // --------------------------------------------------------
    // แสดงข้อมูล BA / Store
    // --------------------------------------------------------

    if (result.ba) {

      const ba =
        result.ba;


      qrInfoBox.innerHTML =

        '<strong>QR ID:</strong> ' +
        (ba.QR_ID || '-') +

        '<br><br>' +

        '<strong>BA ID:</strong> ' +
        (ba.BA_ID || '-') +

        '<br>' +

        '<strong>BA Name:</strong> ' +
        (ba.BA_NAME || '-') +

        '<br><br>' +

        '<strong>Store ID:</strong> ' +
        (ba.STORE_ID || '-') +

        '<br>' +

        '<strong>Store Name:</strong> ' +
        (ba.STORE_NAME || '-') +

        '<br><br>' +

        '<strong>Province:</strong> ' +
        (ba.PROVINCE || '-') +

        '<br>' +

        '<strong>QR Status:</strong> ' +
        (ba.QR_STATUS || '-');

    }


    // --------------------------------------------------------
    // Console
    // --------------------------------------------------------

    console.log(
      'Verified LINE User ID:',
      result.lineUserId
    );

    console.log(
      'Verified QR:',
      result.ba
    );


  } catch (error) {

    console.error(error);


    statusBox.innerText =
      'เกิดข้อผิดพลาด\n\n' +
      error.message;

    statusBox.className =
      'error';

  }

}


// ============================================================
// RUN
// ============================================================

startLIFF();

</script>

</body>

</html>
