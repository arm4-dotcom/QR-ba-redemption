<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR BA Redemption</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 20px;
      text-align: center;
    }


    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }


    h1 {
      margin-top: 0;
      font-size: 24px;
    }


    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-line;
    }


    .success {
      background: #e8f5e9 !important;
    }


    .error {
      background: #ffebee !important;
    }


    .info {
      margin-top: 15px;
      padding: 16px;
      background: #eeeeee;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.8;
      text-align: left;
      word-break: break-word;
    }


    .result-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }


    .result-row {
      margin-bottom: 10px;
    }


    .result-label {
      font-weight: bold;
    }


    .claim-box {
      margin-top: 15px;
      padding: 14px;
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 10px;
      text-align: center;
    }


    .claim-id {
      font-size: 15px;
      font-weight: bold;
      word-break: break-all;
    }


  </style>

</head>


<body>

  <div class="container">

    <h1>QR BA Redemption</h1>

    <div id="status">
      กำลังเริ่ม LIFF...
    </div>


    <div
      id="qrinfo"
      class="info"
      style="display:none;"
    ></div>

  </div>


<script>


// ============================================================
// CONFIG
// ============================================================

// LIFF ID
const LIFF_ID =
  '2011608815-zoBVWfw9';


// Google Apps Script Web App
const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwkRRQ_KHO3cp7AX4V7N7c7v0Sdoir4oPbacRkm0kQo0WgVNAp18A1bQrxp-5Mly0csEA/exec';


// ============================================================
// ELEMENTS
// ============================================================

const statusBox =
  document.getElementById('status');

const qrInfoBox =
  document.getElementById('qrinfo');


// ============================================================
// GET QR_ID FROM URL
// ============================================================

function getQRId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  // 1. URL ปกติ
  const directQR =
    params.get('qr');


  if (directQR) {
    return directQR.trim();
  }


  // 2. liff.state
  const liffState =
    params.get('liff.state');


  if (liffState) {

    try {

      const decodedState =
        decodeURIComponent(liffState);

      const stateParams =
        new URLSearchParams(
          decodedState
        );

      const stateQR =
        stateParams.get('qr');


      if (stateQR) {
        return stateQR.trim();
      }


    } catch (error) {

      console.error(
        'Cannot parse liff.state:',
        error
      );

    }

  }


  return null;

}


// ============================================================
// GET CAMPAIGN_ID FROM URL
// ============================================================

function getCampaignId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  // 1. URL ปกติ
  const directCampaign =
    params.get('campaign');


  if (directCampaign) {
    return directCampaign.trim();
  }


  // 2. liff.state
  const liffState =
    params.get('liff.state');


  if (liffState) {

    try {

      const decodedState =
        decodeURIComponent(liffState);

      const stateParams =
        new URLSearchParams(
          decodedState
        );

      const stateCampaign =
        stateParams.get('campaign');


      if (stateCampaign) {
        return stateCampaign.trim();
      }


    } catch (error) {

      console.error(
        'Cannot parse campaign from liff.state:',
        error
      );

    }

  }


  return null;

}


// ============================================================
// DISPLAY INITIAL QR / CAMPAIGN INFORMATION
// ============================================================

function showQRInfo(qrId, campaignId) {

  qrInfoBox.style.display = 'block';

  qrInfoBox.innerHTML =

    '<div class="result-row">' +
      '<span class="result-label">QR ID:</span> ' +
      escapeHtml(qrId) +
    '</div>' +

    '<div class="result-row">' +
      '<span class="result-label">Campaign ID:</span> ' +
      escapeHtml(campaignId) +
    '</div>';

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return '-';
  }

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


// ============================================================
// DISPLAY SUCCESS RESULT
// ============================================================

function showSuccessResult(result) {

  const ba =
    result.ba || {};


  const campaign =
    result.campaign || {};


  // ----------------------------------------------------------
  // รองรับทั้งชื่อ Field แบบ camelCase และ UPPERCASE
  // ----------------------------------------------------------

  const campaignId =
    campaign.campaignId ||
    campaign.CAMPAIGN_ID ||
    result.campaignId ||
    '-';


  const campaignName =
    campaign.campaignName ||
    campaign.CAMPAIGN_NAME ||
    result.campaignName ||
    '-';


  const product =
    campaign.product ||
    campaign.PRODUCT ||
    result.product ||
    '-';


  const baName =
    ba.BA_NAME ||
    ba.baName ||
    result.baName ||
    '-';


  const storeId =
    ba.STORE_ID ||
    ba.storeId ||
    result.storeId ||
    '-';


  const storeName =
    ba.STORE_NAME ||
    ba.storeName ||
    result.storeName ||
    '-';


  const claimId =
    result.claimId ||
    '-';


  const status =
    result.status ||
    'SUCCESS';


  // ----------------------------------------------------------
  // Success message
  // ----------------------------------------------------------

  statusBox.innerText =
    'ทำรายการสำเร็จ';

  statusBox.className =
    'success';


  // ----------------------------------------------------------
  // Transaction Result
  // ----------------------------------------------------------

  qrInfoBox.style.display =
    'block';


  qrInfoBox.innerHTML =

    '<div class="result-title">' +
      'รายละเอียดรายการ' +
    '</div>' +


    '<div class="claim-box">' +

      '<div class="result-label">' +
        'Claim ID' +
      '</div>' +

      '<div class="claim-id">' +
        escapeHtml(claimId) +
      '</div>' +

    '</div>' +


    '<br>' +


    '<div class="result-row">' +
      '<span class="result-label">Campaign:</span><br>' +
      escapeHtml(campaignName) +
    '</div>' +


    '<div class="result-row">' +
      '<span class="result-label">Product:</span><br>' +
      escapeHtml(product) +
    '</div>' +


    '<div class="result-row">' +
      '<span class="result-label">BA:</span><br>' +
      escapeHtml(baName) +
    '</div>' +


    '<div class="result-row">' +
      '<span class="result-label">Store:</span><br>' +
      escapeHtml(storeId) +

      (
        storeName !== '-' &&
        storeName !== ''
          ? '<br>' + escapeHtml(storeName)
          : ''
      ) +

    '</div>' +


    '<div class="result-row">' +
      '<span class="result-label">Status:</span><br>' +
      escapeHtml(status) +
    '</div>';

}


// ============================================================
// START LIFF
// ============================================================

async function startLIFF() {

  try {


    // --------------------------------------------------------
    // 1. Initialize LIFF
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังเชื่อมต่อ LINE...';


    await liff.init({

      liffId:
        LIFF_ID

    });


    // --------------------------------------------------------
    // 2. อ่าน QR_ID
    // --------------------------------------------------------

    const qrId =
      getQRId();


    if (!qrId) {

      statusBox.innerText =
        'ไม่พบ QR_ID\n\n' +
        'กรุณาเปิดผ่าน QR Code ที่ถูกต้อง';

      statusBox.className =
        'error';

      return;

    }


    // --------------------------------------------------------
    // 3. อ่าน CAMPAIGN_ID
    // --------------------------------------------------------

    const campaignId =
      getCampaignId();


    if (!campaignId) {

      statusBox.innerText =
        'ไม่พบ Campaign ID\n\n' +
        'กรุณาเปิดผ่าน QR Code ของ Campaign ที่ถูกต้อง';

      statusBox.className =
        'error';

      return;

    }


    // --------------------------------------------------------
    // แสดง QR + Campaign
    // --------------------------------------------------------

    showQRInfo(
      qrId,
      campaignId
    );


    // --------------------------------------------------------
    // 4. ตรวจสอบ Login
    // --------------------------------------------------------

    if (!liff.isLoggedIn()) {

      statusBox.innerText =
        'กำลังเข้าสู่ระบบ LINE...';


      liff.login({

        redirectUri:
          window.location.href

      });


      return;

    }


    // --------------------------------------------------------
    // 5. ขอ ID Token
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังตรวจสอบตัวตน...';


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        'ไม่สามารถรับ LINE ID Token ได้'
      );

    }


    // --------------------------------------------------------
    // 6. ส่งข้อมูลไปยัง GAS
    // --------------------------------------------------------

    statusBox.innerText =
      'กำลังส่งข้อมูลไปยัง Server...';


    const response =
      await fetch(

        GAS_URL,

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:

            JSON.stringify({

              idToken:
                idToken,

              qrId:
                qrId,

              campaignId:
                campaignId

            }),

          redirect:
            'follow'

        }

      );


    // --------------------------------------------------------
    // 7. อ่านผลจาก GAS
    // --------------------------------------------------------

    const result =
      await response.json();


    console.log(
      'Server response:',
      result
    );


    // --------------------------------------------------------
    // 8. ตรวจสอบผล
    // --------------------------------------------------------

    if (!result.success) {

      throw new Error(

        result.message ||
        'Server transaction failed'

      );

    }


    // --------------------------------------------------------
    // 9. แสดงผลสำเร็จ
    // --------------------------------------------------------

    showSuccessResult(result);


    // --------------------------------------------------------
    // Console
    // --------------------------------------------------------

    console.log(
      'Verified LINE User ID:',
      result.lineUserId
    );


    console.log(
      'Verified QR:',
      result.ba
    );


    console.log(
      'Verified Campaign:',
      result.campaign
    );


    console.log(
      'Claim ID:',
      result.claimId
    );


  } catch (error) {


    console.error(error);


    statusBox.innerText =
      'เกิดข้อผิดพลาด\n\n' +
      error.message;


    statusBox.className =
      'error';

  }

}


// ============================================================
// RUN
// ============================================================

startLIFF();


</script>

</body>

</html>
